# 默认实验名称；每次运行可用 --name "实验名称" 覆盖，支持中文。
name = "skillsbench-openhands-shell-only"
# 路径相对于此 TOML 文件；结果按 benchmark/harness/model/name 存放。
output_dir = "../logs/exp"
conditions = ["with-skill"]
repeats =3
pass_threshold = 1.0

[dataset]
index = "../data/task/skillsbench.json"
# 删除 task_ids 后，使用完整索引作为候选任务池。
# task_ids = ["3d-scan-calc"]
# 可选：从候选任务池中进行不放回抽样。
sample_size = 10
seed = 42
loader = "datasets.skillsbench:load_tasks"
prepare = "datasets.skillsbench:prepare_task"
setup = "datasets.skillsbench:setup_environment"

[model]
model = "deepseek/deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
timeout = 120
num_retries = 0
# 可选 SDK 字段，需所选模型支持：
# temperature = 0.0
# max_output_tokens = 8192
# reasoning_effort = "high"

[agent]
runner = "harness.openhands.runner:execute"
recorder = "agent_session_analyzer:OpenHandsRecorder"
max_iterations = 100
tool_timeout_sec = 120
max_output_chars = 20000
# 共用工具名称，由所选 harness 加载已有实现。
# Shell 基线；与 skillsbench.toml 对比时使用相同的实验设置。
tools = [
    "terminal",
    "think",
    "finish",
]
# 省略 timeout_sec 时，遵循各任务的 agent.timeout_sec。

[evaluator]
function = "datasets.skillsbench:evaluate"

[environment]
factory = "datasets.skillsbench:create_environment"
startup_timeout = 1800
cleanup_timeout = 180
