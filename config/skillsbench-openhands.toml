# Default experiment name; override per run with --name "my-experiment" (Chinese is supported).
name = "skillsbench-openhands"
# Paths are relative to this TOML file; results use benchmark/harness/model/name.
output_dir = "../logs/exp"
conditions = ["with-skill"]
repeats = 3
pass_threshold = 1.0

[dataset]
index = "../data/task/skillsbench.json"
# Delete task_ids to use the complete index as the candidate pool.
# task_ids = ["3d-scan-calc"]
# Optional: sample without replacement from the candidate pool.
sample_size = 10
seed = 42
loader = "datasets.skillsbench:load_tasks"
prepare = "datasets.skillsbench:prepare_task"
setup = "datasets.skillsbench:setup_environment"

[model]
model = "deepseek/deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
timeout = 120
num_retries = 0
# Optional SDK fields, when supported by the selected model:
# temperature = 0.0
# max_output_tokens = 8192
# reasoning_effort = "high"

[agent]
runner = "harness.openhands.runner:execute"
recorder = "agent_session_analyzer:OpenHandsRecorder"
max_iterations = 100
tool_timeout_sec = 120
max_output_chars = 20000
# Same existing registry tool interfaces and control tools as main.py.
# Registry reads use environment.registry_url and this task's skill names.
# execute_resource downloads the selected resource and runs it in the trial.
tools = [
    "search_skills",
    "load_skill",
    "load_resource",
    "execute_resource",
    "terminal",
    "read_file",
    "write_file"
]
# Omit timeout_sec to honor each task's agent.timeout_sec.

[evaluator]
function = "datasets.skillsbench:evaluate"

[environment]
factory = "datasets.skillsbench:create_environment"
registry_url = "http://127.0.0.1:5000"
startup_timeout = 1800
cleanup_timeout = 180
