# 默认实验名称；每次运行可用 --name "实验名称" 覆盖，支持中文。
name = "skillsbench-dsh"
# 路径相对于此 TOML 文件；结果按 benchmark/harness/model/name 存放。
output_dir = "../logs/exp"
conditions = ["with-skill"]
repeats = 3
pass_threshold = 1.0

[dataset]
index = "../data/task/skillsbench.json"
# 删除 task_ids 后，使用完整索引作为候选任务池。
# task_ids = ["3d-scan-calc"]
# 在采样前排除这些任务；暂时跳过评分阶段有插件加载问题的任务。
exclude_task_ids = ["pedestrian-traffic-counting", "dynamic-object-aware-egomotion"]
# 可选：从候选任务池中进行不放回抽样。
sample_size = 10
seed = 42
loader = "datasets.skillsbench:load_tasks"
prepare = "datasets.skillsbench:prepare_task"
setup = "datasets.skillsbench:setup_environment"

[model]
# 使用与 harness/dsh/main.py 相同的原生 dsh 路由。配对比较时，
# 请确认两个 harness 配置选择了同一个服务端模型版本。
provider = "deepseek-official"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
# max_tokens = 8192
# reasoning_effort = "high"

[agent]
runner = "harness.dsh.runner:execute"
recorder = "agent_session_analyzer:DshRecorder"
# 省略 dsh_home 时，使用本项目的 config/dsh 目录。
profile = "sdk-minimal"
tool_timeout_sec = 120
max_output_chars = 20000
tools = [
    "search_skills",
    "load_skill",
    "load_resource",
    "execute_resource",
    "terminal",
    "read_file",
    "write_file"
]
# 省略 timeout_sec 时，遵循各任务的 agent.timeout_sec。
# OpenHands 的 max_iterations 不属于 DeepSeekHarnessConfig 配置项。

[evaluator]
function = "datasets.skillsbench:evaluate"

[environment]
factory = "datasets.skillsbench:create_environment"
registry_url = "http://127.0.0.1:5000"
startup_timeout = 1800
cleanup_timeout = 180
