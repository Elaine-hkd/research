[dataset]
# 路径相对此文件，不相对实验入口或执行目录。
package = "../../data/skillsbench"

# 稳定性抽样：覆盖 easy/medium/hard 与 4 个领域，用于观察通过率和失败模式。
task_ids = [
    "court-form-filling",
    "weighted-gdp-calc",
    "python-scala-translation",
    "lab-unit-harmonization",
    "debug-trl-grpo",
]
sample_size = 5
seed = 42

loader = "datasets.skillsbench:load_tasks"
prepare = "datasets.skillsbench:prepare_task"
setup = "datasets.skillsbench:setup_environment"
