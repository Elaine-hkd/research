[dataset]
# 路径相对此文件，不相对实验入口或执行目录。
package = "../../data/gittaskbench"

# 不设置 task_ids 时使用索引中的全部任务。
# 资源包当前接入 PDFPlumber 仓库的全部 3 题（01/02/03，共用一份 code_base 快照）；
# 这里显式锁定，避免以后扩题时旧实验被静默改口径。
task_ids = ["PDFPlumber_01", "PDFPlumber_02", "PDFPlumber_03"]

loader = "datasets.gittaskbench:load_tasks"
prepare = "datasets.gittaskbench:prepare_task"
setup = "datasets.gittaskbench:setup_environment"
