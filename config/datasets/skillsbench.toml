[dataset]
# 路径相对此文件，不相对实验入口或执行目录。
index = "../../data/task/skillsbench.json"

# 不设置 task_ids 时，使用完整索引作为候选任务池。
# task_ids = ["3d-scan-calc"]

# 所有引用此文件的实验共用忽略列表；在采样前排除。
# 保留原 dsh 实验的忽略项，并统一用于其他 SkillsBench 实验。
exclude_task_ids = ["pedestrian-traffic-counting", "dynamic-object-aware-egomotion"]

# 从候选任务池不放回抽样；同次实验的条件和重复共用这份任务清单。
sample_size = 10
seed = 42

loader = "datasets.skillsbench:load_tasks"
prepare = "datasets.skillsbench:prepare_task"
setup = "datasets.skillsbench:setup_environment"
